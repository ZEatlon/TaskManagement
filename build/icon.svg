<?xml version="1.0" encoding="UTF-8"?>
<!--
  应用图标：便签纸叠（三层错位便签纸 + 圆角，扁平静态，无动效 / 无渐变光晕）
  viewBox 256×256，便签本体四边圆角 8px；底-中-顶 三张纸分别有细微阴影线
  表达「叠放」。暖黄主色 #F5C76A，符合「任务进度管理」语境下「便签 / 待办」的视觉习惯。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 顶层便签（旋转 -6°）-->
  <g transform="translate(128 132) rotate(-6) translate(-128 -132)">
    <rect x="56" y="40" width="144" height="180" rx="8" ry="8" fill="#F5C76A"/>
    <!-- 折角小三角：右下角轻微内翻，暗示便签纸真实折角 -->
    <path d="M 192 220 L 200 220 L 200 212 Z" fill="#E0B055"/>
    <!-- 三条横线：暗示便签内容（不用具体文字）-->
    <rect x="76" y="80" width="104" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="76" y="106" width="84" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="76" y="132" width="64" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- 中层便签（旋转 +4°，偏左）-->
  <g transform="translate(128 138) rotate(4) translate(-128 -138)">
    <rect x="48" y="48" width="144" height="180" rx="8" ry="8" fill="#F2A93B"/>
  </g>

  <!-- 底层便签（旋转 -2°，最深）-->
  <g transform="translate(128 144) rotate(-2) translate(-128 -144)">
    <rect x="40" y="56" width="144" height="180" rx="8" ry="8" fill="#E48F2A"/>
  </g>
</svg>