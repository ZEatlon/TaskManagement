<?xml version="1.0" encoding="UTF-8"?>
<!--
  TaskPilot 应用图标 — 时钟面 + 完成对勾

  视觉隐喻：
    - 时钟外圈 = 番茄 / Clock 页面（新的入口）
    - 时针 + 分针自然形成一个「✓」对勾的转角
    - 4 个小时的点 = 时钟刻度（12/3/6/9）
    - 主色 #F5C76A 暖黄延续旧图标调性

  viewBox 1024×1024，所有形状居中对称。描边/线宽 80+ 在 16px
  小尺寸下保留辨识度。背景透明，方便 macOS Dock / Windows 任务栏
  渲染时不与系统色冲突。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS 风圆角方形底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="#F5C76A"/>

  <!-- 内圈白底（时钟面板） -->
  <circle cx="512" cy="512" r="340" fill="#FFFFFF"/>

  <!-- 时钟外圈（描边装饰，宽度 32，颜色比主色深一档） -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="#E0A848" stroke-width="24"/>

  <!-- 4 个主时刻度（12/3/6/9，加粗圆点） -->
  <g fill="#E0A848">
    <circle cx="512" cy="160" r="22"/>
    <circle cx="864" cy="512" r="22"/>
    <circle cx="512" cy="864" r="22"/>
    <circle cx="160" cy="512" r="22"/>
  </g>

  <!--
    时针 + 分针拼成「✓」对勾：
      - 分针（对勾长边）：中心 → 右上
      - 时针（对勾短边）：中心 → 左下
      - 两条线汇于中心 + 中心实心点连起来就是一个对勾 ✓
  -->
  <g stroke="#2D2A24" stroke-width="80" stroke-linecap="round" fill="none">
    <!-- 分针：对勾长边 -->
    <line x1="512" y1="512" x2="772" y2="312"/>
    <!-- 时针：对勾短边 -->
    <line x1="512" y1="512" x2="312" y2="672"/>
  </g>

  <!-- 中心实心圆点（针轴） -->
  <circle cx="512" cy="512" r="44" fill="#F5C76A" stroke="#2D2A24" stroke-width="20"/>
</svg>
